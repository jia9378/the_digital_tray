<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Digital Tray</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Gradients and filters shared by every SVG on the page. -->
  <svg class="defs-holder" aria-hidden="true"><defs id="shared-defs"></defs></svg>

  <header class="topbar">
    <div class="brand-wrap">
      <span class="brand">DIGITAL TRAY</span>
      <span class="file-name">untitled ring 01</span>
    </div>
    <nav class="modes" id="modes">
      <button class="mode active" data-mode="tray">TRAY</button>
      <button class="mode" data-mode="piece">PIECE</button>
      <span class="mode disabled" title="Coming later">STUDY</span>
      <button class="mode" data-mode="tryon">TRY ON</button>
    </nav>
    <div class="scale-bar">
      <button class="scale-chip" id="scale-chip" title="Set up your screen for true size"></button>
      <button class="ghost-btn" id="fs-btn">FULL SCREEN</button>
    </div>
  </header>

  <div class="warning" id="scale-warning" hidden></div>

  <main class="panel">
    <div class="workspace">
      <div class="stage">

        <!-- The tray. 1 unit in the viewBox = 1 mm. -->
        <section id="tray-view">
          <div class="board-scroll">
            <svg id="tray" class="board">
              <g class="base"></g>
              <g class="stones" filter="url(#stone-shadow)"></g>
              <g class="overlay"></g>
            </svg>
          </div>
        </section>

        <!-- Ring / bracelet / necklace template. Also in mm. -->
        <section id="piece-view" hidden>
          <div class="piece-bar" id="piece-bar"></div>
          <div class="board-scroll" id="piece-scroll">
            <svg id="piece" class="board">
              <g class="base"></g>
              <g class="stones" filter="url(#stone-shadow)"></g>
              <g class="overlay"></g>
            </svg>
          </div>
          <div class="compare-grid" id="compare-grid" hidden></div>
        </section>

        <!-- Try On: a photo with a bank card in it, and the piece at that scale. -->
        <section id="tryon-view" hidden>
          <div class="to-wrap">
            <div class="to-stage" id="to-stage"></div>
            <aside class="to-panel" id="to-panel"></aside>
          </div>
        </section>

      </div>
      <aside class="inspector" id="inspector"></aside>
    </div>

    <section class="library-wrap">
      <p class="label">STONE LIBRARY &mdash; CHOOSE A STONE AND COLOUR, THEN DRAG A SHAPE ON (OR CLICK TO ADD)</p>
      <div class="library-picker" id="library-picker"></div>
      <div class="library" id="library"></div>
    </section>

    <footer class="status">
      <span id="count">0 stones on tray</span>
      <button class="link-button" id="clear-btn">CLEAR</button>
    </footer>
  </main>

  <dialog id="scale-dialog" class="scale-dialog"></dialog>
  <div id="ghost" class="ghost"></div>

  <script src="js/gems.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/scale.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/tryon.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
